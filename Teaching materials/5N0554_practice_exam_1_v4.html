:::glossary
image space: The complete set of all possible images of a given size. An 8x8 binary image has 2^64 elements in its image space.
brute force: Checking every possible option in sequence. Always correct but completely impractical for large spaces.
Hamming distance: The number of positions where two binary strings of the same length differ. Two 8x8 images differing in exactly three pixels have Hamming distance 3.
neighbourhood: The set of all images within a given Hamming distance of a target. Larger k means a larger neighbourhood.
parity: Whether the count of 1-bits in a binary string is odd or even. Even parity means an even number of 1s.
:::

<script>
const EXAM_MARKDOWN = document.getElementById('exam-content').textContent;
const EXAM_TOOLS_CODE = `
import io, base64, sys
try:
  from js import document, window
  _IN_PYODIDE = True
except ImportError:
  _IN_PYODIDE = False
  class _Stub:
    def __getattr__(self, n): return _Stub()
    def __call__(self, *a, **kw): return _Stub()
  document = window = _Stub()

def _current_output():
  if not _IN_PYODIDE: return None
  eid = window.examCurrentOutputId
  if not eid: raise RuntimeError("exam_tools: no output context — run this inside an exam cell")
  return document.getElementById(eid)

def _append(html):
  el = _current_output()
  if el: el.insertAdjacentHTML("beforeend", html)

def _esc(s):
  return str(s).replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

def show(obj):
  'Display a matplotlib Figure or any object inline in the exam output.'
  try:
    import matplotlib.figure as mpl_fig
    if isinstance(obj, mpl_fig.Figure):
      import matplotlib.pyplot as plt
      buf = io.BytesIO()
      obj.savefig(buf, format="png", bbox_inches="tight", dpi=100)
      buf.seek(0)
      b64 = base64.b64encode(buf.read()).decode("ascii")
      buf.close()
      plt.close(obj)
      _append(f'<img src="data:image/png;base64,{b64}" class="out-img" alt="figure">')
      return
  except ImportError:
    pass
  safe = _esc(str(obj))
  _append(f'<pre class="out-text">{safe}</pre>')
`;

let pyodide = null, pyReady = false;
let meta = {}, cells = [], editors = {}, textAnswers = {};
let studentName = '';
const storageKey = () => 'cm_exam_' + (meta.version||'v1') + '_' + studentName.replace(/\W/g,'_').toLowerCase();

window.onload = async () => {
  meta = parseFrontmatter(EXAM_MARKDOWN);
  document.getElementById('load-title').textContent = meta.title || 'Examination';
  document.title = meta.title || 'Examination';
  try { await initPyodide(); } catch(e) {
    document.getElementById('load-msg').textContent = 'Python failed to load: ' + e.message;
    return;
  }
  showNameScreen();
};

async function initPyodide() {
  setMsg('Loading Python runtime (step 1 of 2)...');
  pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.27.4/full/' });
  setMsg('Installing packages (step 2 of 2)...');
  await pyodide.loadPackage(['micropip']);
  await pyodide.runPythonAsync(`
import micropip
await micropip.install(["numpy", "matplotlib"])
`);
  pyodide.FS.writeFile('/exam_tools.py', EXAM_TOOLS_CODE);
  await pyodide.runPythonAsync(`
import sys, io, matplotlib
sys.path.insert(0, '/')
matplotlib.use('Agg')
import exam_tools
sys.stdout = io.StringIO()
`);
  pyReady = true;
}

function setMsg(t) { document.getElementById('load-msg').textContent = t; }

function showNameScreen() {
  document.getElementById('card-title').textContent = meta.title || 'Examination';
  document.getElementById('card-meta').textContent =
    [meta.module, meta.version, meta.session].filter(Boolean).join(' — ');
  document.getElementById('loading').style.display = 'none';
  document.getElementById('name-screen').style.display = 'flex';
  document.getElementById('sname').addEventListener('keydown', e => {
    if (e.key === 'Enter') beginExam();
  });
}

async function beginExam() {
  studentName = document.getElementById('sname').value.trim();
  if (!studentName) { alert('Please enter your full name.'); return; }
  try {
    const s = localStorage.getItem(storageKey());
    if (s) textAnswers = JSON.parse(s);
  } catch(e) {}
  document.getElementById('name-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('h-title').textContent = [meta.title, meta.module].filter(Boolean).join(' — ');
  document.getElementById('h-student').textContent = studentName;
  if (pyReady) {
    document.getElementById('pyodide-status').textContent = 'Python ready';
    document.getElementById('pyodide-status').className = 'ready';
  }
  cells = parseExam(EXAM_MARKDOWN);
  renderExam();
  await runSetupCells();
  updateProgress();
}

function parseFrontmatter(text) {
  const m = text.match(/^---\n([\s\S]*?)\n---\n/);
  if (!m) return {};
  const o = {};
  m[1].split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > 0) o[line.slice(0,idx).trim()] = line.slice(idx+1).trim();
  });
  return o;
}

let GLOSSARY = {};
function parseGlossary(text) {
  const g = {};
  const m = text.match(/:::glossary\n([\s\S]*?):::/);
  if (!m) return g;
  m[1].split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > 0) {
      const term = line.slice(0,idx).trim();
      const def  = line.slice(idx+1).trim();
      if (term && def) g[term.toLowerCase()] = {term, def};
    }
  });
  return g;
}

function parseExam(text) {
  const body = text.replace(/^---\n[\s\S]*?\n---\n/, '').replace(/:::glossary\n[\s\S]*?:::/, '');
  const out = [];
  const fence = /^```(python(?:\s+(?:setup|provided))?|text)\s*\n([\s\S]*?)^```\s*$/gm;
  let last = 0, codeIdx = 0, m;
  while ((m = fence.exec(body)) !== null) {
    if (m.index > last) out.push({type:'markdown', content: body.slice(last, m.index)});
    const tag = m[1].trim(), src = m[2];
    if      (tag === 'python setup')    out.push({type:'setup',    content:src});
    else if (tag === 'python provided') out.push({type:'provided', content:src});
    else if (tag === 'text')            out.push({type:'text',     content:src.trim(), id:'ta_'+(codeIdx++)});
    else                                out.push({type:'code',     content:src, id:'cell_'+(codeIdx++),
                                                  studentCode:src, outputHTML:'', lastRun:null, hasError:false});
    last = m.index + m[0].length;
  }
  if (last < body.length) out.push({type:'markdown', content: body.slice(last)});
  return out;
}

function renderMD(text) {
  const inlineFmt = s => {
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    Object.values(GLOSSARY).forEach(({term, def}) => {
      const re = new RegExp(`\\b(${term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b`, 'gi');
      s = s.replace(re, mm => `<span class="tt" data-tip="${esc(def)}">${mm}</span>`);
    });
    return s;
  };
  let html = '', inList = false, listTag = '';
  const closeList = () => { if(inList){html+=`</${listTag}>\n`;inList=false;listTag='';} };
  const lines = text.split('\n');
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^#{1,6}\s/.test(l)) {
      closeList();
      const lvl = l.match(/^(#+)/)[1].length;
      const t = inlineFmt(l.replace(/^#+\s+/,''));
      html += lvl<=2 ? `<h${lvl}>${t}</h${lvl}>\n` : `<h3>${t}</h3>\n`;
      i++; continue;
    }
    if (/^---+$/.test(l.trim())) { closeList(); html+='<hr>\n'; i++; continue; }
    if (/^[-*]\s+/.test(l)) {
      if (!inList||listTag!=='ul'){closeList();html+='<ul>\n';inList=true;listTag='ul';}
      html+=`<li>${inlineFmt(l.replace(/^[-*]\s+/,''))}</li>\n`;i++;continue;
    }
    if (/^\d+\.\s+/.test(l)) {
      if (!inList||listTag!=='ol'){closeList();html+='<ol>\n';inList=true;listTag='ol';}
      html+=`<li>${inlineFmt(l.replace(/^\d+\.\s+/,''))}</li>\n`;i++;continue;
    }
    if (l.startsWith('|')) {
      closeList();
      const rows=[];
      while(i<lines.length&&lines[i].startsWith('|')){rows.push(lines[i]);i++;}
      html+='<table>\n';
      rows.forEach((r,ri)=>{
        const cells=r.split('|').slice(1,-1).map(c=>c.trim());
        if(ri===1&&cells.every(c=>/^[-:]+$/.test(c)))return;
        const tag=ri===0?'th':'td';
        html+='<tr>'+cells.map(c=>`<${tag}>${inlineFmt(c)}</${tag}>`).join('')+'</tr>\n';
      });
      html+='</table>\n';continue;
    }
    closeList();
    if (l.trim()===''){i++;continue;}
    let para=l; i++;
    while(i<lines.length&&lines[i].trim()!==''&&!/^[#|*\-\d]/.test(lines[i])&&!/^---+$/.test(lines[i].trim())){
      para+=' '+lines[i];i++;
    }
    html+=`<p>${inlineFmt(para)}</p>\n`;
  }
  closeList();
  return html;
}

function renderExam() {
  GLOSSARY = parseGlossary(EXAM_MARKDOWN);
  const main = document.getElementById('main');
  main.innerHTML = '';
  cells.forEach((cell, idx) => {
    if      (cell.type==='markdown') main.appendChild(buildMarkdown(cell));
    else if (cell.type==='setup')    {}
    else if (cell.type==='provided') main.appendChild(buildProvided(cell, idx));
    else if (cell.type==='code')     main.appendChild(buildCodeCell(cell, idx));
    else if (cell.type==='text')     main.appendChild(buildTextCell(cell));
  });
}

function buildMarkdown(cell) {
  const div = document.createElement('div');
  div.className = 'prose';
  div.innerHTML = renderMD(cell.content);
  return div;
}

function buildProvided(cell, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'cell provided';
  wrap.innerHTML = `<div class="cell-bar"><span class="cell-lbl">Provided code — read only</span></div>`;
  const ta = document.createElement('textarea');
  wrap.appendChild(ta);
  const editor = CodeMirror.fromTextArea(ta, {mode:'python', readOnly:true,
    lineNumbers:true, theme:'eclipse', lineWrapping:true});
  editor.setValue(cell.content.trimEnd());
  editor.refresh();
  return wrap;
}

function buildCodeCell(cell, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'cell';
  wrap.id = 'wrap_' + cell.id;
  const bar = document.createElement('div');
  bar.className = 'cell-bar';
  bar.innerHTML = `<span class="cell-lbl">Python</span>
    <span class="cell-stat" id="stat_${cell.id}"></span>
    <button class="run-btn" id="btn_${cell.id}" onclick="runCell('${cell.id}')">Run</button>`;
  wrap.appendChild(bar);
  const ta = document.createElement('textarea');
  wrap.appendChild(ta);
  const editor = CodeMirror.fromTextArea(ta, {
    mode:'python', lineNumbers:true, theme:'eclipse', lineWrapping:true,
    extraKeys:{Tab: cm=>cm.replaceSelection('    ','end')}
  });
  editor.setValue(cell.studentCode.trimEnd());
  setTimeout(() => editor.refresh(), 0);   /* renders without needing a click */
  editor.on('change', () => { cell.studentCode = editor.getValue(); });
  editors[cell.id] = editor;
  const out = document.createElement('div');
  out.className = 'cell-out';
  out.id = 'out_' + cell.id;
  if (cell.outputHTML) out.innerHTML = cell.outputHTML;
  wrap.appendChild(out);
  return wrap;
}

function buildTextCell(cell) {
  const wrap = document.createElement('div');
  wrap.className = 'text-cell';
  wrap.id = 'textwrap_' + cell.id;
  const bar = document.createElement('div');
  bar.className = 'text-cell-bar';
  bar.textContent = 'Written answer';
  wrap.appendChild(bar);
  /* question text shown above the textarea, not inside it as a placeholder */
  if (cell.content) {
    const prompt = document.createElement('div');
    prompt.className = 'text-prompt';
    prompt.textContent = cell.content;
    wrap.appendChild(prompt);
  }
  const ta = document.createElement('textarea');
  ta.className = 'text-answer';
  ta.placeholder = 'Write your answer here...';
  ta.id = 'textans_' + cell.id;
  if (textAnswers[cell.id]) {
    ta.value = textAnswers[cell.id];
    wrap.classList.add('answered');
  }
  ta.addEventListener('input', () => {
    textAnswers[cell.id] = ta.value;
    wrap.classList.toggle('answered', ta.value.trim().length > 0);
    saveAnswers();
    updateProgress();
  });
  wrap.appendChild(ta);
  return wrap;
}

async function runSetupCells() {
  for (const cell of cells) {
    if (cell.type === 'setup') {
      try { await pyodide.runPythonAsync(cell.content); } catch(e) { console.warn('Setup error:', e); }
    }
  }
}

let isRunning = false;
async function runCell(id) {
  if (!pyReady || isRunning) return;
  isRunning = true;
  const cell = cells.find(c => c.id === id);
  if (!cell) { isRunning=false; return; }
  const btn  = document.getElementById('btn_'+id);
  const stat = document.getElementById('stat_'+id);
  const out  = document.getElementById('out_'+id);
  btn.disabled = true; btn.textContent = 'Running...';
  stat.textContent = ''; stat.className = 'cell-stat';
  out.innerHTML = '';
  window.examCurrentOutputId = 'out_'+id;
  const code = editors[id] ? editors[id].getValue() : cell.studentCode;
  try {
    await pyodide.runPythonAsync(`import sys, io; sys.stdout = io.StringIO()`);
    await pyodide.runPythonAsync(code);
    const stdout = await pyodide.runPythonAsync(`_s=sys.stdout.getvalue(); sys.stdout=io.StringIO(); _s`);
    if (stdout) out.innerHTML += `<pre class="out-text">${esc(stdout)}</pre>`;
    stat.textContent = 'OK'; stat.className = 'cell-stat ok';
    cell.lastRun = new Date();
  } catch(e) {
    const msg = String(e.message || e).replace(/File "<exec>"[^\n]*/g, '').trim();
    out.innerHTML = `<div class="out-err">${esc(msg)}</div>`;
    stat.textContent = 'Error'; stat.className = 'cell-stat err';
    cell.hasError = true;
  }
  cell.outputHTML = out.innerHTML;
  btn.disabled = false; btn.textContent = 'Run';
  window.examCurrentOutputId = null;
  isRunning = false;
  updateProgress();
}

function saveAnswers() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify(textAnswers));
    const s = document.getElementById('save-status');
    s.textContent = 'Saved';
    clearTimeout(saveAnswers._t);
    saveAnswers._t = setTimeout(()=>{s.textContent='';}, 1800);
  } catch(e){}
}

function exportJSON() {
  const codeAnswers = {};
  cells.filter(c=>c.type==='code').forEach(c => {
    codeAnswers[c.id] = {code: editors[c.id]?.getValue() || c.studentCode, output: c.outputHTML};
  });
  const blob = new Blob([JSON.stringify({
    student: studentName, module: meta.module, version: meta.version,
    exported: new Date().toISOString(), textAnswers, codeAnswers
  }, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const safe = studentName.replace(/[^a-z0-9]/gi,'_').toLowerCase();
  a.href = URL.createObjectURL(blob);
  a.download = `exam_${safe}_${meta.version||'v1'}.json`;
  a.click();
  showToast('Answers exported');
}

function updateProgress() {
  const textCells = cells.filter(c=>c.type==='text');
  const codeCells = cells.filter(c=>c.type==='code');
  const doneTxt   = textCells.filter(c=>(textAnswers[c.id]||'').trim().length>0).length;
  const doneCode  = codeCells.filter(c=>c.lastRun).length;
  const total = textCells.length + codeCells.length;
  const done  = doneTxt + doneCode;
  document.getElementById('progress-bar').style.width = (total>0?(done/total)*100:0)+'%';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

</script>
